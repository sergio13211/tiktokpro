<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surprise</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    text-align: center;
  }
  main { padding: 24px; }
  h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 12px; }
  p { margin: 0 0 28px; opacity: 0.9; }
  a.button {
    display: inline-block;
    padding: 16px 40px;
    font-size: 1.25rem;
    font-weight: 700;
    color: #2575fc;
    background: #fff;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    transition: transform 0.15s ease;
  }
  a.button:hover { transform: scale(1.05); }
</style>
</head>
<body>
  <main>
    <h1>I have a surprise for you</h1>
    <p>Go on, give it a click.</p>
    <a class="button" href="https://pornhub.com">Click here for surprise</a>
  </main>
</body>
</html>
